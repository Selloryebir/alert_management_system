services:
  backend:
    environment:
      SERVER_PORT: "8443"
      APP_DEPLOYMENT_MODE: NETWORK
      SESSION_COOKIE_SECURE: "true"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/secrets/tls_keystore
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_STORE_PASSWORD_FILE: /run/secrets/tls_keystore_password
    secrets:
      - tls_keystore
      - tls_keystore_password
    ports: !override
      - "${NETWORK_BIND_ADDRESS:-0.0.0.0}:8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl --insecure --fail --silent --show-error https://127.0.0.1:8443/api/v1/health | grep --quiet '^{\"status\":\"UP\",\"service\":\"alert-management-backend\"'"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 3

secrets:
  tls_keystore:
    file: ${APP_SECRETS_DIR:-.runtime/compose-secrets}/tls-keystore.p12
  tls_keystore_password:
    file: ${APP_SECRETS_DIR:-.runtime/compose-secrets}/tls-keystore-password.txt
