name: 仓库基础检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 验证结构与文档链接
        run: python3 scripts/validate_repository.py
      - name: 验证自动化工作流与状态
        run: python3 scripts/validate_automation.py
