name: 仓库基础检查

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 准备交付物生成环境
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/deliverables/requirements.lock
      - name: 安装交付物生成依赖
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r tools/deliverables/requirements.lock
      - name: 验证结构与文档链接
        run: python3 scripts/validate_repository.py
      - name: 验证自动化工作流与状态
        run: python3 scripts/validate_automation.py
      - name: 验证正式产品基线
        run: python3 scripts/validate_formal_baseline.py
      - name: 验证 M14 发布候选契约
        run: |
          python3 -m unittest discover -s tests/release -p "test_*.py"
          python3 scripts/validate_release_candidate.py
      - name: 验证正式交付物生成器单元契约
        run: python3 -m unittest discover -s tools/deliverables -p "test_*.py"
