name: Windows 原生业务发布检查

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-native-check.yml"
      - "packaging/native/**"
      - "scripts/native/**"
      - "scripts/release/**"
      - "src/**"
      - "samples/**"
      - "tests/e2e/**"
      - "docs/guides/**"
      - "docs/deliverables/**"
      - "deliverables/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
  pull_request:
    paths:
      - ".github/workflows/windows-native-check.yml"
      - "packaging/native/**"
      - "scripts/native/**"
      - "scripts/release/**"
      - "src/**"
      - "samples/**"
      - "tests/e2e/**"
      - "docs/guides/**"
      - "docs/deliverables/**"
      - "deliverables/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"

permissions:
  contents: read

jobs:
  native-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 缓存锁定运行时和 Chromium
        uses: actions/cache@v6
        with:
          path: |
            .runtime/native/cache
            .runtime/native/tools
          key: m14-native-v1-${{ runner.os }}-${{ hashFiles('scripts/native/build-release.ps1', 'packaging/native/runtime-lock.json', 'packaging/native/pyinstaller.lock', 'packaging/native/algorithm-service.spec', 'src/algorithm/requirements.lock', 'src/frontend/package-lock.json', 'tests/e2e/package-lock.json') }}

      - name: 构建并以标准用户执行业务发布预检查
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release/verify-business-release.ps1

      - name: 保存原生发布包
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alert-management-system-windows-x64
          path: |
            .runtime/release/artifacts/**/*.zip
            .runtime/release/artifacts/**/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 保存验收摘要和失败日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m14-native-verification-evidence
          path: |
            .runtime/release/business-release-summary.json
            .runtime/release/verification/**/verification-summary.json
            .runtime/release/verification/**/round-*-summary.json
            .runtime/release/verification/**/round-*-results/**
            .runtime/native/standard-user-verification/*.log
          if-no-files-found: warn
          retention-days: 14
