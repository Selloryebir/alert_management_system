services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: alert_management
      POSTGRES_USER: alert_management
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  algorithm:
    build:
      context: .
      dockerfile: packaging/docker/algorithm.Dockerfile
    environment:
      ALGORITHM_HOST: 0.0.0.0
      ALGORITHM_PORT: "8001"
      ALGORITHM_MODEL_FILE: /model/algorithm-model.enc
      ALGORITHM_MODEL_KEY_FILE: /model-key/algorithm-model-key.txt
    volumes:
      - algorithm_model:/model:ro
      - algorithm_model_key:/model-key:ro
    depends_on:
      model-provisioner:
        condition: service_completed_successfully
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)); assert value == {'status':'UP','service':'algorithm-service','version':'0.2.0','contract_version':'v2'}"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  model-provisioner:
    build:
      context: .
      dockerfile: packaging/docker/algorithm.Dockerfile
    entrypoint:
      - /bin/sh
      - -ec
    user: "0:0"
    command:
      - |
        model=/model/algorithm-model.enc
        key=/model-key/algorithm-model-key.txt
        report=/model/algorithm-model-report.json
        existing=0
        for item in "$$model" "$$key" "$$report"; do
          if [ -s "$$item" ]; then existing=$$((existing + 1)); fi
        done
        if [ "$$existing" -eq 3 ]; then
          ALGORITHM_MODEL_FILE="$$model" ALGORITHM_MODEL_KEY_FILE="$$key" \
            python -c 'from algorithm_service.supervised import load_model_from_environment; assert load_model_from_environment() is not None'
          exit 0
        fi
        if [ "$$existing" -ne 0 ]; then
          echo "检测到上次中断留下的不完整监督模型，正在重建。" >&2
          rm -f "$$model" "$$key" "$$report"
        fi
        rm -f "$$model".tmp-* "$$key".tmp-* "$$report".tmp-*
        python /app/model-training/train.py \
          --data /app/model-training/data/engineering-scenarios.jsonl \
          --model-out "$$model" --key-out "$$key" --report-out "$$report"
        chown 10001:10001 "$$model" "$$key" "$$report"
        chmod 0444 "$$model" "$$report"
        chmod 0400 "$$key"
    volumes:
      - algorithm_model:/model
      - algorithm_model_key:/model-key
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: packaging/docker/backend.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/alert_management
      DB_USERNAME: alert_management
      DB_PASSWORD_FILE: /run/secrets/database_password
      ALGORITHM_HEALTH_URL: http://algorithm:8001/health
      ALGORITHM_ANALYSIS_URL: http://algorithm:8001/api/v2/analyze
      APP_IDENTITY: 报警管理系统
      APP_DEPLOYMENT_MODE: LOCAL_CONTAINER
      APP_BOOTSTRAP_ADMIN_USERNAME: admin
      APP_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      SESSION_COOKIE_SECURE: "false"
    secrets:
      - database_password
      - bootstrap_admin_password
    depends_on:
      postgres:
        condition: service_healthy
      algorithm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health | grep --quiet '^{\"status\":\"UP\",\"service\":\"alert-management-backend\"'"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 3
    restart: "no"

volumes:
  pgdata:
  algorithm_model:
  algorithm_model_key:

secrets:
  database_password:
    file: ${APP_SECRETS_DIR:-.runtime/compose-secrets}/database-password.txt
  bootstrap_admin_password:
    file: ${APP_SECRETS_DIR:-.runtime/compose-secrets}/bootstrap-admin-password.txt
