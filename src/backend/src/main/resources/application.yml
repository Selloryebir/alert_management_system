server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: alert-management-backend
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_SIZE:50MB}
      max-request-size: ${IMPORT_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/alert_management}
    username: ${DB_USERNAME:alert_management}
    password: ${DB_PASSWORD:alert_management}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:1000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

app:
  service: ${APP_SERVICE_NAME:alert-management-backend}
  version: ${APP_VERSION:0.1.0}
  identity: ${APP_IDENTITY:2026 年灾后重建 Demo}
  algorithm:
    health-url: ${ALGORITHM_HEALTH_URL:http://127.0.0.1:8001/health}
    connect-timeout: ${ALGORITHM_CONNECT_TIMEOUT:500ms}
    request-timeout: ${ALGORITHM_REQUEST_TIMEOUT:1s}
    service: ${ALGORITHM_SERVICE:algorithm-service}
    version: ${ALGORITHM_VERSION:0.1.0}
    contract-version: ${ALGORITHM_CONTRACT_VERSION:v1}
